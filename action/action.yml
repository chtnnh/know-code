name: know-code verify
description: >-
  Verify Know-Code-Verified commit trailers against grounded tree hashes
  (index and merge-base→write-tree). Callers must checkout the PR tip
  (ref: github.event.pull_request.head.sha) with fetch-depth: 0 — the
  default merge commit has no trailers. Use on pull_request only.
author: chtnnh
branding:
  icon: shield
  color: gray-dark

inputs:
  base-branch:
    description: Base branch name used for diff hashing (must match local config)
    required: false
    default: main
  require-all:
    description: If true, fail when no matching trailer is present (stricter messaging)
    required: false
    default: "false"
  require-range-trailers:
    description: If true, verify every commit in the range has Know-Code-Verified trailers
    required: false
    default: "false"
  version:
    description: npm version range for know-code when not building from this repo
    required: false
    default: "^0.3.0"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install know-code CLI
      shell: bash
      run: |
        ROOT="${GITHUB_WORKSPACE}"
        if [[ -f "$ROOT/packages/cli/package.json" ]]; then
          npm install --prefix "$ROOT/packages/cli"
          npm run build --prefix "$ROOT/packages/cli"
          npm install -g "$ROOT/packages/cli"
        elif [[ -f "${GITHUB_ACTION_PATH}/../packages/cli/package.json" ]]; then
          ROOT="${GITHUB_ACTION_PATH}/.."
          npm install --prefix "$ROOT/packages/cli"
          npm run build --prefix "$ROOT/packages/cli"
          npm install -g "$ROOT/packages/cli"
        else
          npm install -g "@chtnnh/know-code@${{ inputs.version }}"
        fi

    - name: Ensure config
      shell: bash
      run: |
        mkdir -p .know-code
        if [[ ! -f .know-code/config.json ]]; then
          printf '{\n  "level": "standard",\n  "baseBranch": "%s",\n  "requireTrailer": true\n}\n' "${{ inputs.base-branch }}" > .know-code/config.json
        fi

    - name: Verify Know-Code-Verified trailer
      shell: bash
      run: |
        ARGS=""
        if [[ "${{ inputs.require-all }}" == "true" ]]; then
          ARGS="$ARGS --require-all"
        fi
        if [[ "${{ inputs.require-range-trailers }}" == "true" ]]; then
          ARGS="$ARGS --require-range-trailers"
        fi
        know-code verify $ARGS
