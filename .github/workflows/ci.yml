name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: CLI smoke
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js init --level lite
          node packages/cli/dist/index.js status --json
          set +e
          node packages/cli/dist/index.js check
          code=$?
          set -e
          test "$code" -eq 2
          HASH=$(node packages/cli/dist/index.js hash)
          node packages/cli/dist/index.js pass --level lite --hash "$HASH"
          node packages/cli/dist/index.js check
